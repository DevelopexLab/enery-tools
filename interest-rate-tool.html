        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        input[type="text"], input[type="number"] {
          font-family: 'Roboto', sans-serif;
          outline: none;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
          -webkit-appearance: none; margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }
        .entity-row:hover { background: #e8f5e9 !important; }
        .entity-row { cursor: pointer; transition: background 0.15s; }
        .btn-primary { 
          background: #FABE4B; color: #232D32; border: none; border-radius: 24px; 
          padding: 12px 32px; font-weight: 700; font-size: 15px; cursor: pointer;
          font-family: 'Roboto', sans-serif; transition: all 0.2s;
        }
        .btn-primary:hover { background: #e5a93e; transform: translateY(-1px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .btn-secondary {
          background: #8CC896; color: white; border: none; border-radius: 24px;
          padding: 10px 24px; font-weight: 500; font-size: 14px; cursor: pointer;
          font-family: 'Roboto', sans-serif; transition: all 0.2s;
        }
        .btn-secondary:hover { background: #7ab886; }
        .btn-outline {
          background: transparent; color: #232D32; border: 2px solid #B9BEC3;
          border-radius: 24px; padding: 10px 24px; font-weight: 500; font-size: 14px;
          cursor: pointer; font-family: 'Roboto', sans-serif; transition: all 0.2s;
        }
        .btn-outline:hover { border-color: #8CC896; color: #8CC896; }
        .card {
          background: white; border-radius: 12px; border: 1px solid #B9BEC3;
          padding: 24px; transition: box-shadow 0.2s;
        }
        .card:hover { box-shadow: 0 4px 16px rgba(35,45,50,0.08); }
        .tag {
          display: inline-block; padding: 2px 10px; border-radius: 12px;
          font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
        }
        .scroll-list {
          max-height: 420px; overflow-y: auto; border: 1px solid #B9BEC3;
          border-radius: 12px; background: white;
        }
        .scroll-list::-webkit-scrollbar { width: 6px; }
        .scroll-list::-webkit-scrollbar-thumb { background: #8CC896; border-radius: 3px; }
        .input-field {
          width: 100%; padding: 10px 14px; border: 1px solid #B9BEC3; border-radius: 8px;
          font-size: 14px; font-family: 'Roboto', sans-serif; transition: border 0.2s;
        }
        .input-field:focus { border-color: #8CC896; box-shadow: 0 0 0 3px rgba(140,200,150,0.15); }
        .step-indicator {
          display: flex; gap: 8px; align-items: center; margin-bottom: 32px;
        }
        .step-dot {
          width: 32px; height: 32px; border-radius: 50%; display: flex;
          align-items: center; justify-content: center; font-weight: 700;
          font-size: 14px; transition: all 0.3s;
        }
        .step-line { width: 40px; height: 2px; transition: background 0.3s; }
        .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .radio-option {
          padding: 12px 20px; border: 2px solid #B9BEC3; border-radius: 12px;
          cursor: pointer; transition: all 0.2s; font-weight: 500; font-size: 14px;
        }
        .radio-option.selected {
          border-color: #8CC896; background: rgba(140,200,150,0.1); color: #232D32;
        }
        .radio-option:hover { border-color: #8CC896; }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .result-box {
          background: linear-gradient(135deg, #232D32 0%, #465055 100%);
          border-radius: 16px; padding: 32px; color: white;
        }
        .warning-box {
          background: #FFF3CD; border: 1px solid #FABE4B; border-radius: 12px;
          padding: 16px; display: flex; gap: 12px; align-items: flex-start;
        }
        .error-box {
          background: #FDECEA; border: 1px solid #e57373; border-radius: 12px;
